name: App Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Llave de firma
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/firma.p12
      - name: Compilar APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk calistenia.apk
          V="v1.${{ github.run_number }}"
          gh release create "$V" calistenia.apk --title "Calistenia Android $V" --notes "App de Android. Descarga calistenia.apk e instálala." --latest
